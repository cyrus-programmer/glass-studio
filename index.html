ground:linear-gradient(140deg,#a5a7df26,#ffffff07);border:1px solid #ffffff27;padding:13px;overflow:hidden}.tile:nth-child(2n){background:linear-gradient(140deg,#5fa6b530,#ffffff09)}.tile h3{font-size:12px;margin:11px 0 3px}.tiny{font-size:10px;color:#afbad1}.sect{font-size:15px;margin:21px 0 11px;letter-spacing:-.3px}.btn{width:100%;border:0;border-radius:14px;background:linear-gradient(110deg,#9e9dff,#c49cff);color:#161529;padding:13px 14px;font-size:13px;font-weight:800;margin:9px 0}.btn.secondary{background:#ffffff14;color:white;border:1px solid #ffffff24}.btn.small{width:auto;padding:8px 12px;margin:0;font-size:11px}.field{background:#ffffff0e;border:1px solid #ffffff1d;border-radius:14px;padding:12px 13px;width:100%;color:white;font-size:12px;margin:5px 0 11px}.rowItem{display:flex;gap:12px;align-items:center;border-bottom:1px solid #ffffff14;padding:13px 0}.rowItem .em{font-size:23px;width:35px;text-align:center}.rowItem .txt{flex:1}.rowItem strong{display:block;font-size:12px}.rowItem small{display:block;font-size:10px;color:#a4aec9;margin-top:4px}.swatches{display:flex;gap:9px;margin:10px 0 17px}.swatch{height:30px;width:30px;border-radius:100%;border:2px solid #fff7}.swatch.selected{outline:2px solid #bcaeff;outline-offset:3px}.range{width:100%;accent-color:#a9a0ff;margin:14px 0 18px}.preview{background:radial-gradient(circle at 70% 25%,#bb7bc584,transparent 45%),linear-gradient(155deg,#303c69,#122a43 70%,#0d1d31);border-radius:25px;padding:17px;min-height:210px;display:flex;justify-content:center;align-items:center}.preview .widget{width:90%}.note{border-left:3px solid #aaa3fc;padding:8px 13px;background:#ffffff0b;font-size:11px;color:#cad3e4;margin:15px 0;border-radius:0 10px 10px 0}.phoneHome{background:radial-gradient(ellipse at 70% 20%,#cb84b8,transparent 40%),linear-gradient(150deg,#32467b,#213651 80%);border-radius:22px;min-height:350px;padding:21px}.appgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:35px}.appico{background:#ffffff28;border:1px solid #ffffff50;border-radius:15px;height:48px;text-align:center;display:grid;place-items:center;font-size:22px}.wall{height:165px;border-radius:20px;background:radial-gradient(circle at 80% 10%,#ffd6b8,transparent 36%),radial-gradient(circle at 20% 80%,#638fed,transparent 44%),#3b346d;border:1px solid #ffffff30}.wall.alt{background:radial-gradient(circle at 20% 20%,#81b4af,transparent 35%),linear-gradient(120deg,#343c6b,#10192d)}.wall.warm{background:radial-gradient(circle at 60% 30%,#e9aa94,transparent 35%),linear-gradient(120deg,#a07286,#36245a)}.info h2{font-size:17px;margin:2px 0 8px}.info h3{font-size:12px;color:#bcb3ff;margin-top:20px}.info p,.info li{font-size:12px;color:#c3c9d9;line-height:1.6}.info .meta{padding:10px;border-radius:11px;background:#ffffff0d;margin-top:14px}.callout{font-size:11px;color:#aaaeca;padding:8px 0}.iconbar{font-size:23px;color:#bab4ff}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.chip{border-radius:10px;padding:8px;background:#ffffff15;color:#c5cce0;font-size:11px;border:1px solid #ffffff19}.progress{height:8px;border-radius:10px;background:#ffffff1c;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;width:70%;background:#c6abfc;border-radius:10px}.tag{font-size:10px;background:#b3a1ff2c;color:#dacfff;padding:5px 8px;border-radius:9px}a{color:#b9c2ff}@media(max-width:1060px){.layout{grid-template-columns:200px 1fr}.info{grid-column:1/-1;max-height:none}}@media(max-width:650px){header{padding:18px}.layout{display:flex;flex-direction:column;padding:0 12px 20px;gap:18px}.sidebar{max-height:158px;overflow:auto}.stage{order:2}.info{order:3}.phone{transform:scale(.95);transform-origin:top center;margin-bottom:-37px}}

const specs=[
['Welcome','Onboarding','Introduces visual identity and value proposition.','Primary action advances to initial setup.'],['Choose your style','Onboarding','User chooses an initial design taste: Aurora, Frost, Midnight, Pearl.','Save style preference and preselect a suggested theme.'],['Compatibility','Onboarding','Check Android version, launcher capabilities and widget support.','Display supported and unsupported capabilities explicitly.'],['Permissions','Onboarding','Explain location, calendar, photos and notifications at point of need.','Never block unrelated functionality if an optional permission is denied.'],

function nav(i){index=i;paint();} function btn(text,id,secondary=false){return `<button class="btn ${secondary?'secondary':''}" onclick="nav(${id})">${text}</button>`} function head(title,eyebrow='GLASS STUDIO'){return `<div class="over">${eyebrow}</div><div class="hrow"><h2 class="big">${title}</h2><span style="font-size:20px;color:#d9d4ff">✧</span></div>`}function tile(t,ico,d,id){return `<div class="tile" onclick="nav(${id})" style="cursor:pointer"><div style="font-size:29px">${ico}</div><h3>${t}</h3><div class="tiny">${d}</div></div>`}function clock(){return `<div class="widget" style="border-color:${tint};background:linear-gradient(130deg,${tint}${Math.round(opacity/100*180).toString(16).padStart(2,'0')},#ffffff0a)"><div class="tiny">WEDNESDAY · OCT 14</div><strong>09:41</strong><div class="tiny">Clear skies · 24°</div></div>`}function rows(items){return items.map(([emoji,t,d,i])=>`<div class="rowItem" onclick="nav(${i})" style="cursor:pointer"><div class="em">${emoji}</div><div class="txt"><strong>${t}</strong><small>${d}</small></div><span>›</span></div>`).join('')}
function content(i){switch(i){case 0:return head('Make your screen extraordinary','WELCOME')+`<div class="hero" style="height:270px"><h2>Every glance,<br>more beautiful.</h2><div class="widget" style="position:absolute;right:20px;bottom:25px;width:230px">${clock()}</div></div><p class="sub">Premium widgets, custom themes, and a glass finish tailored to your device.</p>`+btn('Get started',1);case 1:return head('Find your aesthetic','PERSONALIZE')+`<div class="grid2">${['Aurora','Frost','Midnight','Pearl'].map((x,j)=>tile(x,['🌌','❄️','🌙','✨'][j],'Tap to explore',2)).join('')}</div><p class="sub">You can switch styles whenever you like.</p>`+btn('Continue',2);case 2:return head('Designed for your Android','DEVICE CHECK')+rows([['✓','Home screen widgets','Available on supported launchers',3],['✓','Glass-themed widgets','Blur support differs by device',3],['◇','Samsung lock screen','Certain models and OS versions only',3]])+btn('Check permissions',3);case 3:return head('You control access','SETUP')+rows([['☀','Weather location','Only for local forecast widgets',4],['▦','Calendar events','Only for calendar widgets',4],['▣','Photos','Only for personal photo widgets',4],['♧','Notifications','Optional update and weather alerts',4]])+btn('Explore widgets',4);case 4:return head('Make it yours')+`<div class="hero"><div class="over">EDITOR'S PICK</div><h2>Introducing<br>Crystal Aura</h2><p class="sub" style="max-width:130px;color:#e3e7fb">Soft light. Glass depth. Custom fit.</p><div class="widget" style="width:134px;bottom:17px;right:14px;position:absolute"><div class="tiny">TODAY</div><strong style="font-size:31px">14</strong><div class="tiny">Wednesday</div></div></div><div class="hrow"><h3 class="sect">Explore widgets</h3><button class="pill" onclick="nav(6)">See all ↗</button></div><div class="grid2">${tile('Clocks','◷','36 designs',5)}${tile('Weather','☀','32 designs',5)}${tile('Calendar','▦','22 designs',5)}${tile('Battery','⚡','18 designs',5)}</div><h3 class="sect">Curated for you</h3>${rows([['✦','Crystal Collection','11 coordinated widgets',17],['☾','Midnight Edit','Subtle dark glass surfaces',17]])}`;case 5:return head('Widget categories')+`<div class="grid2">${['Time & clock','Weather','Date & calendar','Battery','Productivity','Photos','Sports','System'].map((x,j)=>tile(x,['◷','☀','▦','⚡','◉','▧','★','⌁'][j],`${[36,32,22,18,26,14,12,16][j]} designs`,6)).join('')}</div>`;case 6:return head('Explore widgets')+`<input class="field" placeholder="⌕  Search 350+ designs" onfocus="nav(8)"><div class="chips"><span class="chip">All</span><span class="chip">Free</span><span class="chip">Pro</span><span class="chip">Clocks</span></div><div class="grid2">${tile('Aether Clock','09:41','Clock · Medium',7)}${tile('Clear Sky','☀ 24°','Weather · Wide',7)}${tile('Glass Date','14','Date · Small',7)}${tile('Daily Progress','◕','Tracker · Wide',7)}${tile('Energy','⚡ 78%','Battery · Medium',7)}${tile('Memory','▣','Photos · Medium',7)}</div>`;case 7:return head('Aether Clock','WIDGET DETAIL')+`<div class="preview">${clock()}</div><div class="hrow"><h3 class="sect">Modern glass clock</h3><span class="tag">FREE</span></div><p class="sub">Minimal digital clock with customizable typography, glass layers and tap actions.</p><div class="chips"><span class="chip">2 × 2</span><span class="chip">4 × 2</span><span class="chip">Dynamic</span></div>`+btn('Customize widget',10)+btn('Add default widget',14,true);case 8:return head('Search everything')+`<input class="field" placeholder="Search clock, theme or wallpaper…" oninput="q=this.value;document.getElementById('searchResult').textContent=q?'Results for “'+q+'”':'Trending searches'"><h3 class="sect" id="searchResult">Trending searches</h3>${rows([['◷','Digital clock','Widgets',6],['❄','Frosted glass','Theme collections',16],['☀','Weather forecast','Widgets',6],['▧','Photo grid','Widgets',6]])}`;case 9:return head('Your favorites')+`<p class="sub">Keep every saved design in one place.</p><div class="grid2">${tile('Aether Clock','◷','Saved yesterday',7)}${tile('Aurora Blend','✧','Your favorite theme',17)}</div>`;case 10:return head('Customize Aether','LIVE EDITOR')+`<div class="preview" style="min-height:190px">${clock()}</div><div class="hrow"><h3 class="sect">Widget size</h3><span class="tag">${size}</span></div><div class="chips">${['Small','Medium','Wide'].map(x=>`<button class="pill ${size===x?'on':''}" onclick="size='${x}';paint()">${x}</button>`).join('')}</div><h3 class="sect">Fine tune</h3>${rows([['Aa','Typography','Font, weight, time format',11],['◐','Color & glass','Tint, opacity, stroke',12],['↗','Tap actions','Choose what opens',13]])}`+btn('Add widget to home screen',14);case 11:return head('Typography','CUSTOMIZATION')+`<div class="preview">${clock()}</div>${rows([['Aa','Font family','Geometric Sans',10],['①','Digit style','Rounded numerals',10],['◉','Font weight','Semibold',10]])}<p class="sub">Preview values are examples. Real device fonts can differ.</p>`+btn('Apply typography',10);case 12:return head('Glass & color','CUSTOMIZATION')+`<div class="preview">${clock()}</div><h3 class="sect">Accent tint</h3><div class="swatches">${['#b7a5ff','#7ed5e8','#f2bdbe','#ffe4a2','#a8d6b5'].map(c=>`<button class="swatch ${tint===c?'selected':''}" onclick="tint='${c}';paint()" style="background:${c}"></button>`).join('')}</div><div class="hrow"><span class="sub">Glass intensity</span><span class="tag">${opacity}%</span></div><input class="range" type="range" min="10" max="90" value="${opacity}" oninput="opacity=+this.value;document.querySelector('.tag').textContent=opacity+'%';document.querySelector('.preview .widget').style.background='linear-gradient(130deg,'+tint+Math.round(opacity/100*180).toString(16).padStart(2,'0')+',#ffffff0a)'">`+btn('Apply appearance',10);case 13:return head('Widget tap action')+rows([['◷','Open Clock app','Default',10],['▦','Open Calendar','Launch a supported app',10],['↗','Open custom link','Configure a validated URL',10],['⚙','Open widget
